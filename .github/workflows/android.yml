name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: npm install --no-audit --no-fund
      - name: Add the Android project
        run: npx cap add android
      - name: Make the app icon
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#13151a' --iconBackgroundColorDark '#13151a'
      - name: Copy the app files into Android
        run: npx cap sync android
      - name: Give every build a higher version number
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"11.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChannelSoundboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelSoundboard-APK
          path: ChannelSoundboard.apk
      - name: Publish on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChannelSoundboard.apk
