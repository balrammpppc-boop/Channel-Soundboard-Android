$('#tt').onclick=()=>{songs.forEach(x=>{x._pl=0});rnd.clear();total();toast('Played time reset')};

/* Android app: keep playing (and keep scheduled start times) while the screen is off or locked */
const BG=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BackgroundMode;
let bgOn=false;
function bgSync(){
 if(!BG)return;
 const need=songs.some(s=>s.startAt)||pages.some(p=>p.startAt)||al();
 if(need===bgOn)return;bgOn=need;
 if(need){
  BG.setSettings({title:'Channel Soundboard',text:'Playing in the background',subText:'',bigText:false,resume:true,silent:false,hidden:false,color:'F2B53D',icon:'ic_launcher',channelName:'Channel Soundboard',channelDescription:'Keeps the music playing while the screen is off',allowClose:false,showWhen:false,visibility:'public'})
   .then(()=>{try{BG.requestNotificationsPermission()}catch(e){}return BG.enable()})
   .then(()=>BG.disableWebViewOptimizations())
   .then(()=>{if(!lg('cs_bat')){lsv('cs_bat','1');BG.requestDisableBatteryOptimizations().catch(()=>{})}})
   .catch(()=>{});
 }else BG.disable().catch(()=>{});
}
if(BG){const _ks=kaSync;kaSync=function(){_ks();bgSync()};setInterval(bgSync,3000)}
